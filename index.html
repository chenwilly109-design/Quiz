<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartQuiz 智慧題庫系統 (永久保存版)</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { max-width: 760px; width: 100%; }
    .nav { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-btn { flex: 1; padding: 10px; background: #cbd5e1; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: #334155; }
    .nav-btn.active { background: #059669; color: white; }
    .card { background: #ffffff; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 16px; }
    h1 { font-size: 20px; margin-top: 0; }
    h3 { font-size: 16px; line-height: 1.5; margin-top: 0; }
    .btn { background: #059669; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-danger { background: #ef4444; }
    .btn-secondary { background: #cbd5e1; color: #1e293b; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .folder-item { border: 1px solid #e2e8f0; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .option-btn { width: 100%; text-align: left; padding: 12px; margin-bottom: 8px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; cursor: pointer; font-size: 15px; }
    .option-btn:hover { border-color: #059669; background: #f0fdf4; }
    .correct { background: #ecfdf5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
    .wrong { background: #fef2f2 !important; border-color: #ef4444 !important; color: #991b1b; }
    .progress-bar { background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; margin: 12px 0; }
    .progress-fill { background: #059669; height: 100%; width: 0%; transition: width 0.3s; }
    .hidden { display: none; }
    .explanation { background: #f8fafc; border-left: 4px solid #059669; padding: 12px; margin: 12px 0; font-size: 14px; color: #334155; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .q-preview { border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; background: #f1f5f9; }
  </style>
</head>
<body>

<div class="container">
  <!-- 導覽列 -->
  <div class="nav">
    <button class="nav-btn active" id="nav-dash" onclick="showTab('dashboard')">📁 資料夾與測驗</button>
    <button class="nav-btn" id="nav-upload" onclick="showTab('upload')">📤 上傳與匯入題庫</button>
  </div>

  <!-- 分頁 1：資料夾與測驗設定 -->
  <div id="page-dashboard">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
        <h1 style="margin:0;">資料夾分類管理</h1>
        <button class="btn" onclick="addFolder()">+ 新增資料夾</button>
      </div>
      <div id="folder-list"></div>
    </div>

    <div class="card" style="background: #0f172a; color: white;">
      <h2 style="font-size: 18px; margin-top:0;">⚡ 開始自訂測驗</h2>
      
      <label style="font-size: 13px; color: #94a3b8;">選擇分類資料夾：</label>
      <select id="quiz-folder-select" style="background:#1e293b; color:white; border-color:#334155;"></select>

      <label style="font-size: 13px; color: #94a3b8;">抽題數量（可自行輸入數字）：</label>
      <input type="number" id="quiz-count" value="10" min="1" style="background:#1e293b; color:white; border-color:#334155;">

      <button class="btn" style="width: 100%; padding: 12px; font-size: 16px;" onclick="startQuiz()">🚀 開始測驗</button>
    </div>
  </div>

  <!-- 分頁 2：檔案上傳與解析 -->
  <div id="page-upload" class="hidden">
    <div class="card">
      <h1>匯入題庫 (貼上 JSON 代碼)</h1>
      <label>匯入目標資料夾：</label>
      <select id="upload-folder-target" onchange="renderPreview()"></select>

      <label>請將剛剛產生的 JSON 內容完整貼入下方：</label>
      <textarea id="raw-text" rows="10" placeholder="請在此貼上 JSON 題目代碼..."></textarea>

      <button class="btn" style="width: 100%; font-size: 15px;" onclick="parseAndImport()">💾 儲存並永久匯入題庫</button>
    </div>

    <div class="card">
      <h3>目前資料夾內的題目預覽</h3>
      <div id="preview-list"></div>
      <button class="btn btn-danger" style="margin-top:10px;" onclick="clearTargetFolder()">清空該資料夾題目</button>
    </div>
  </div>

  <!-- 分頁 3：測驗畫面 -->
  <div id="page-quiz" class="card hidden">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #64748b; font-weight: 600;">
      <span id="quiz-progress-text">第 1 題</span>
      <span id="quiz-score-text">得分: 0</span>
    </div>
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>

    <h3 id="question-stem">題目載入中...</h3>
    <div id="options-container"></div>

    <div id="explanation-box" class="explanation hidden">
      <strong>【考點解析】</strong> <span id="explanation-text"></span>
    </div>

    <div style="margin-top: 16px; text-align: right;">
      <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>下一題 ➔</button>
    </div>
  </div>

  <!-- 分頁 4：結果結算 -->
  <div id="page-results" class="card hidden" style="text-align: center;">
    <h1>🎉 測驗完成！</h1>
    <p style="font-size: 32px; font-weight: bold; color: #059669; margin: 12px 0;" id="final-score">0 / 0</p>
    <button class="btn" onclick="showTab('dashboard')">返回主頁</button>
  </div>
</div>

<script>
  // 資料庫邏輯：優先讀取 LocalStorage，否則初始化預設資料庫
  const STORAGE_KEY = 'SMARTQUIZ_PERMANENT_DB_V3';

  function getDB() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { return JSON.parse(raw); } catch(e) {}
    }
    // 預設資料夾
    return {
      "f1": { id: "f1", name: "免疫與疫苗 40題庫", questions: [] }
    };
  }

  let db = getDB();

  function saveDB() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    renderFolders();
    updateSelects();
    renderPreview();
  }

  function renderFolders() {
    const list = document.getElementById('folder-list');
    if (!list) return;
    list.innerHTML = '';
    Object.values(db).forEach(f => {
      const div = document.createElement('div');
      div.className = 'folder-item';
      div.innerHTML = `
        <div>
          <strong>${f.name}</strong>
          <span style="font-size:12px; color:#64748b; margin-left:8px;">(${f.questions.length} 題)</span>
        </div>
        <div>
          <button class="btn btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="renameFolder('${f.id}')">✏️ 重命名</button>
          <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteFolder('${f.id}')">🗑️ 刪除</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function updateSelects() {
    const qSel = document.getElementById('quiz-folder-select');
    const uSel = document.getElementById('upload-folder-target');
    if (!qSel || !uSel) return;

    qSel.innerHTML = '<option value="ALL">【全部資料夾混合抽題】</option>';
    uSel.innerHTML = '';

    Object.values(db).forEach(f => {
      qSel.innerHTML += `<option value="${f.id}">${f.name} (${f.questions.length} 題)</option>`;
      uSel.innerHTML += `<option value="${f.id}">${f.name}</option>`;
    });
  }

  function renderPreview() {
    const targetId = document.getElementById('upload-folder-target').value;
    const container = document.getElementById('preview-list');
    if (!targetId || !db[targetId] || !container) return;

    const list = db[targetId].questions;
    if (list.length === 0) {
      container.innerHTML = '<p style="color:#94a3b8; font-size:13px;">該資料夾目前沒有題目。</p>';
      return;
    }

    container.innerHTML = list.map((q, i) => `
      <div class="q-preview">
        <strong>${i + 1}. ${q.stem}</strong><br>
        A) ${q.options[0] || ''} | B) ${q.options[1] || ''} | C) ${q.options[2] || ''} | D) ${q.options[3] || ''}<br>
        <span style="color:#059669; font-weight:bold;">答案: ${q.answer}</span>
      </div>
    `).join('');
  }

  function addFolder() {
    const name = prompt("請輸入新資料夾名稱：");
    if (name && name.trim()) {
      const id = 'f_' + Date.now();
      db[id] = { id, name: name.trim(), questions: [] };
      saveDB();
    }
  }

  function renameFolder(id) {
    const newName = prompt("請輸入新名稱：", db[id].name);
    if (newName && newName.trim()) { db[id].name = newName.trim(); saveDB(); }
  }

  function deleteFolder(id) {
    if (Object.keys(db).length <= 1) return alert("至少需保留一個資料夾！");
    if (confirm(`確定刪除「${db[id].name}」？`)) { delete db[id]; saveDB(); }
  }

  function clearTargetFolder() {
    const targetId = document.getElementById('upload-folder-target').value;
    if (confirm("確定要清空這個資料夾裡的所有題目嗎？")) {
      db[targetId].questions = [];
      saveDB();
    }
  }

  function showTab(tab) {
    document.getElementById('page-dashboard').classList.add('hidden');
    document.getElementById('page-upload').classList.add('hidden');
    document.getElementById('page-quiz').classList.add('hidden');
    document.getElementById('page-results').classList.add('hidden');

    document.getElementById('nav-dash').classList.remove('active');
    document.getElementById('nav-upload').classList.remove('active');

    if (tab === 'dashboard') {
      document.getElementById('page-dashboard').classList.remove('hidden');
      document.getElementById('nav-dash').classList.add('active');
    } else if (tab === 'upload') {
      document.getElementById('page-upload').classList.remove('hidden');
      document.getElementById('nav-upload').classList.add('active');
      renderPreview();
    }
  }

  function parseAndImport() {
    const text = document.getElementById('raw-text').value;
    const targetId = document.getElementById('upload-folder-target').value;
    if (!text.trim()) return alert("請輸入內容！");

    try {
      const jsonArr = JSON.parse(text);
      if (Array.isArray(jsonArr)) {
        db[targetId].questions = jsonArr; // 完全覆蓋寫入，確保存檔正確
        saveDB(); // 寫入 LocalStorage
        alert(`成功存入 ${jsonArr.length} 題！資料已永久儲存。`);
        document.getElementById('raw-text').value = '';
        return showTab('dashboard');
      }
    } catch(e) {
      alert("JSON 格式有誤，請確認是否完整複製！");
    }
  }

  // 測驗進行邏輯
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;

  function startQuiz() {
    const targetFolder = document.getElementById('quiz-folder-select').value;
    const count = parseInt(document.getElementById('quiz-count').value) || 10;

    let pool = [];
    if (targetFolder === 'ALL') {
      Object.values(db).forEach(f => pool.push(...f.questions));
    } else {
      pool = [...db[targetFolder].questions];
    }

    if (pool.length === 0) return alert("這個資料夾沒有題目，請先上傳題庫！");

    currentQuestions = pool.sort(() => Math.random() - 0.5).slice(0, count);
    currentIndex = 0;
    score = 0;

    document.getElementById('page-dashboard').classList.add('hidden');
    document.getElementById('page-quiz').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('quiz-progress-text').innerText = `第 ${currentIndex + 1} 題 / 共 ${currentQuestions.length} 題`;
    document.getElementById('quiz-score-text').innerText = `得分: ${score}`;
    document.getElementById('progress-fill').style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
    document.getElementById('question-stem').innerText = `${currentIndex + 1}. ${q.stem}`;
    
    document.getElementById('explanation-box').classList.add('hidden');
    document.getElementById('next-btn').disabled = true;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    const keys = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      const key = keys[idx];
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = `(${key}) ${opt}`;
      btn.onclick = () => selectOption(key, btn, q);
      container.appendChild(btn);
    });
  }

  function selectOption(selectedKey, btn, q) {
    const container = document.getElementById('options-container');
    const btns = container.querySelectorAll('button');
    btns.forEach(b => b.disabled = true);

    if (selectedKey === q.answer) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      const keys = ['A', 'B', 'C', 'D'];
      btns[keys.indexOf(q.answer)]?.classList.add('correct');
    }

    if (q.exp) {
      document.getElementById('explanation-text').innerText = q.exp;
      document.getElementById('explanation-box').classList.remove('hidden');
    }

    document.getElementById('next-btn').disabled = false;
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      showQuestion();
    } else {
      document.getElementById('page-quiz').classList.add('hidden');
      document.getElementById('page-results').classList.remove('hidden');
      document.getElementById('final-score').innerText = `${score} / ${currentQuestions.length} 題`;
    }
  }

  // 初始化
  saveDB();
</script>

</body>
</html>
